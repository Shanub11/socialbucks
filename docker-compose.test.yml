# docker-compose.test.yml
#
# Disposable local Postgres for the payout settlement engine's test suite.
# This file is NOT used by the application — it exists solely so the Phase 3
# real-database tests have a database to run against, isolated from the
# Supabase project that holds live credentials.
#
# Usage:
#   docker compose -f docker-compose.test.yml up -d
#   TEST_DATABASE_URL="postgres://postgres:postgres@localhost:5432/socialbucks_test" \
#     RUN_DB_TESTS=1 pnpm vitest run ...
#
# Safety invariant: the database name MUST end in `_test`. The test harness
# refuses to run otherwise, so a mis-typed URL can never touch a shared or
# production database.

services:
  postgres-test:
    image: postgres:16-alpine
    container_name: socialbucks-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: socialbucks_test
    ports:
      - "5432:5432"
    volumes:
      - postgres-test-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d socialbucks_test"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-test-data: